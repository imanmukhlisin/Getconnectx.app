; PHP Configuration for Vercel Serverless Runtime
; Suppress deprecated warnings dari Laravel framework yang
; menggunakan PDO::MYSQL_ATTR_SSL_CA yang deprecated di PHP 8.5+

; Hanya tampilkan error fatal, bukan deprecated/notice
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; Jangan tampilkan error di output (tampilkan di log saja)
display_errors = Off
display_startup_errors = Off

; Log error ke stderr (terlihat di Vercel Function Logs)
log_errors = On
error_log = /dev/stderr

; Timezone
date.timezone = Asia/Jakarta

; Memory & execution limit untuk Laravel
memory_limit = 512M
max_execution_time = 60
post_max_size = 20M
upload_max_filesize = 20M
