$kind: http-request
url: "{{baseUrl}}/auth/login/otp/verify"
method: POST
body:
  type: json
  content: |-
    {
        "email": "test@example.com",
        "otp_code": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.environment.set("token", jsonData.token);
          console.log("Token updated successfully!");
      }
    language: text/javascript
order: 3000
