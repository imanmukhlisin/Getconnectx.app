<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectX ✨ Google Sign-In Debugger</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #09090b;
            --card-bg: rgba(24, 24, 27, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 600px;
            perspective: 1000px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) rotateX(-5deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 1rem;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
        }

        .btn-google {
            background: white;
            color: #1f2937;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background: #f8fafc;
        }

        .btn-google:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        .btn-google svg { width: 24px; height: 24px; }

        .result-area {
            display: none;
            margin-top: 2rem;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-area.show { display: block; }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--border);
        }

        .user-details h3 { font-size: 1.1rem; color: #fff; margin-bottom: 0.2rem; }
        .user-details p { font-size: 0.85rem; color: var(--text-muted); }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .token-container {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .token-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 12px;
            padding: 1.25rem;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.8rem;
            color: #4ade80;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .token-box::-webkit-scrollbar { width: 6px; }
        .token-box::-webkit-scrollbar-track { background: transparent; }
        .token-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border);
        }

        .btn-copy:hover { background: rgba(255, 255, 255, 0.1); }

        .btn-verify {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .btn-verify:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 0 25px rgba(99, 102, 241, 0.6); }

        .status-box {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border-radius: 12px;
            font-size: 0.85rem;
            display: none;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.3);
        }

        .status-box.show { display: block; animation: fadeIn 0.3s; }
        .status-box.success { border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05); }
        .status-box.error { border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.05); }

        .status-box pre {
            margin-top: 0.75rem;
            white-space: pre-wrap;
            color: var(--text-muted);
            font-family: monospace;
        }

        .status-box h4 {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .btn-signout {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 0.85rem;
            margin-top: 1.5rem;
            text-decoration: underline;
            cursor: pointer;
            width: 100%;
            display: none;
            text-align: center;
        }

        .btn-signout:hover { color: white; }

        @media (max-width: 640px) {
            .action-buttons { grid-template-columns: 1fr; }
            .glass-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-card">
            <div class="header">
                <span class="header-icon">🚀</span>
                <h1>Firebase Auth Debugger</h1>
                <p class="subtitle">Generate & Verify Firebase ID Token for ConnectX</p>
            </div>

            <button class="btn btn-google" id="googleSignInBtn" onclick="signInWithGoogle()">
                <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Sign in with Google
            </button>

            <div class="result-area" id="resultArea">
                <div class="user-profile" id="userInfo">
                    <!-- Injected via JS -->
                </div>

                <div class="token-container">
                    <div class="section-label">Your Firebase ID Token (eyJ...)</div>
                    <div class="token-box" id="tokenDisplay"></div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-copy" onclick="copyToken()" id="copyBtn">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copy Token
                    </button>
                    <button class="btn btn-verify" onclick="verifyToken()" id="verifyBtn">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Send to Backend
                    </button>
                </div>

                <div class="status-box" id="verifyStatus"></div>
            </div>

            <button class="btn-signout" id="signOutBtn" onclick="signOut()">Sign Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Firebase Configuration for ConnectX
        const firebaseConfig = {
            apiKey: "AIzaSyAS4Gb80L-qGj0s9MwE8iX2OkbaMwsSGZM",
            authDomain: "connectx-50b64.firebaseapp.com",
            projectId: "connectx-50b64",
            storageBucket: "connectx-50b64.firebasestorage.app",
            messagingSenderId: "356178114666",
            appId: "1:356178114666:web:16ea31c4fbd3aabe05f213"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');

        let currentToken = '';

        window.signInWithGoogle = async () => {
            const btn = document.getElementById('googleSignInBtn');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> Connecting...`;
            
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // Get EXACTLY the Firebase ID Token (JWT starting with eyJ...)
                const idToken = await user.getIdToken();
                currentToken = idToken;

                document.getElementById('userInfo').innerHTML = `
                    <img src="${user.photoURL}" class="user-avatar" alt="Avatar">
                    <div class="user-details">
                        <h3>${user.displayName}</h3>
                        <p>${user.email}</p>
                    </div>
                `;
                
                document.getElementById('tokenDisplay').textContent = idToken;
                document.getElementById('resultArea').classList.add('show');
                document.getElementById('signOutBtn').style.display = 'block';
                document.getElementById('googleSignInBtn').style.display = 'none';
                
            } catch (error) {
                console.error('Sign-in error:', error);
                btn.disabled = false;
                btn.innerHTML = originalHtml;
                alert('Sign in failed: ' + error.message);
            }
        };

        window.signOut = async () => {
            await fbSignOut(auth);
            document.getElementById('resultArea').classList.remove('show');
            document.getElementById('signOutBtn').style.display = 'none';
            document.getElementById('verifyStatus').className = 'status-box';
            
            const btn = document.getElementById('googleSignInBtn');
            btn.style.display = 'flex';
            btn.disabled = false;
            btn.innerHTML = `<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Sign in with Google`;
            currentToken = '';
        };

        window.copyToken = () => {
            navigator.clipboard.writeText(currentToken).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copied!`;
                btn.style.background = 'rgba(16, 185, 129, 0.2)';
                btn.style.color = '#10b981';
                btn.style.borderColor = '#10b981';
                
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.style = '';
                }, 2000);
            });
        };

        window.verifyToken = async () => {
            const status = document.getElementById('verifyStatus');
            const btn = document.getElementById('verifyBtn');
            const originalHtml = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> Verifying...`;
            
            status.className = 'status-box show';
            status.innerHTML = '<h4>⏳ Requesting backend...</h4>';

            try {
                // Ensure this matches your local Laravel endpoint!
                const backendUrl = 'http://127.0.0.1:8000/api/v1/auth/oauth/google/verify-token';
                
                const res = await fetch(backendUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        provider_token: currentToken,
                        fcm_token: 'test-from-web-page'
                    })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    status.className = 'status-box show success';
                    status.innerHTML = `<h4>✅ Success (${res.status})</h4><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    status.className = 'status-box show error';
                    status.innerHTML = `<h4>❌ Error (${res.status})</h4><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (err) {
                status.className = 'status-box show error';
                status.innerHTML = `<h4>⚠️ Network Error</h4><pre>Make sure backend is running on port 8000.\n\n${err.message}</pre>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        };
        
        // Setup simple spin animation for the loading state
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } } .animate-spin { animation: spin 1s linear infinite; }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
