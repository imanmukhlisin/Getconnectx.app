<!DOCTYPE html>
<html>
<head>
    <title>ConnectX — Test Google Sign-In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 16px;
            padding: 40px;
            max-width: 640px;
            width: 90%;
        }
        h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
        .subtitle { color: #888; margin-bottom: 28px; font-size: 14px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #fff;
            color: #333;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            width: 100%;
            justify-content: center;
        }
        .btn:hover { background: #f0f0f0; transform: translateY(-1px); }
        .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .btn svg { width: 20px; height: 20px; }
        .result {
            margin-top: 24px;
            padding: 16px;
            background: #0d0d1a;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            display: none;
        }
        .result.show { display: block; }
        .result h3 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .token-box {
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 11px;
            word-break: break-all;
            color: #4ade80;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .copy-btn {
            padding: 8px 16px;
            background: #4ade80;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all .15s;
        }
        .copy-btn:hover { background: #22c55e; }
        .verify-btn {
            padding: 8px 16px;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-left: 8px;
            transition: all .15s;
        }
        .verify-btn:hover { background: #4f46e5; }
        .user-info { margin-bottom: 16px; }
        .user-info p { font-size: 13px; margin: 4px 0; color: #ccc; }
        .user-info strong { color: #fff; }
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .status.success { display: block; background: #052e16; border: 1px solid #166534; color: #4ade80; }
        .status.error { display: block; background: #2a0a0a; border: 1px solid #7f1d1d; color: #f87171; }
        .status pre { white-space: pre-wrap; font-size: 11px; margin-top: 8px; font-family: monospace; }
        .divider { border-top: 1px solid #2a2a4a; margin: 20px 0; }
        #signOutBtn { display: none; margin-top: 12px; background: transparent; border: 1px solid #666; color: #aaa; font-size: 13px; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        #signOutBtn:hover { border-color: #f87171; color: #f87171; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 ConnectX — Test Google Sign-In</h1>
        <p class="subtitle">Login dengan Google via Firebase Auth → ambil Firebase ID Token → test di Postman</p>

        <button class="btn" id="googleSignInBtn" onclick="signInWithGoogle()">
            <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Sign in with Google
        </button>

        <button id="signOutBtn" onclick="signOut()">Sign Out</button>

        <div class="result" id="result">
            <div class="user-info" id="userInfo"></div>
            <div class="divider"></div>
            <h3>Firebase ID Token</h3>
            <div class="token-box" id="tokenDisplay"></div>
            <button class="copy-btn" onclick="copyToken()">📋 Copy Token</button>
            <button class="verify-btn" onclick="verifyToken()">🚀 Test Verify ke Backend</button>
        </div>

        <div class="status" id="verifyStatus"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAS4Gb80L-qGj0s9MwE8iX2OkbaMwsSGZM",
            authDomain: "connectx-50b64.firebaseapp.com",
            projectId: "connectx-50b64",
            storageBucket: "connectx-50b64.firebasestorage.app",
            messagingSenderId: "356178114666",
            appId: "1:356178114666:web:16ea31c4fbd3aabe05f213",
            measurementId: "G-ZPTGJW889K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');

        let currentToken = '';

        window.signInWithGoogle = async () => {
            const btn = document.getElementById('googleSignInBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // Ambil Firebase ID Token
                const idToken = await user.getIdToken();
                currentToken = idToken;

                // Tampilkan user info
                document.getElementById('userInfo').innerHTML = `
                    <p><strong>Name:</strong> ${user.displayName}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>UID:</strong> ${user.uid}</p>
                    <p><strong>Photo:</strong> <img src="${user.photoURL}" width="32" style="border-radius:50%;vertical-align:middle" /></p>
                `;
                
                // Tampilkan token
                document.getElementById('tokenDisplay').textContent = idToken;
                document.getElementById('result').classList.add('show');
                document.getElementById('signOutBtn').style.display = 'inline-block';
                
                btn.textContent = '✅ Signed In';
                console.log('Firebase ID Token:', idToken);
            } catch (error) {
                console.error('Sign-in error:', error);
                btn.textContent = '❌ Error — Try Again';
                btn.disabled = false;
                
                const status = document.getElementById('verifyStatus');
                status.className = 'status error';
                status.innerHTML = `<strong>Sign-in Error:</strong><pre>${error.message}</pre>`;
            }
        };

        window.signOut = async () => {
            await fbSignOut(auth);
            document.getElementById('result').classList.remove('show');
            document.getElementById('signOutBtn').style.display = 'none';
            document.getElementById('verifyStatus').className = 'status';
            const btn = document.getElementById('googleSignInBtn');
            btn.disabled = false;
            btn.innerHTML = `<svg viewBox="0 0 48 48" width="20" height="20"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Sign in with Google`;
            currentToken = '';
        };

        window.copyToken = () => {
            navigator.clipboard.writeText(currentToken).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => btn.textContent = '📋 Copy Token', 2000);
            });
        };

        window.verifyToken = async () => {
            const status = document.getElementById('verifyStatus');
            status.className = 'status';
            status.innerHTML = 'Verifying...';
            status.style.display = 'block';
            status.style.background = '#1a1a2e';
            status.style.border = '1px solid #333';
            status.style.color = '#aaa';

            try {
                const res = await fetch('https://getconnectxapp.vercel.app/api/v1/auth/oauth/google/verify-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider_token: currentToken,
                        fcm_token: 'test-from-web-page'
                    })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    status.className = 'status success';
                    status.innerHTML = `<strong>✅ Backend Response (${res.status}):</strong><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    status.className = 'status error';
                    status.innerHTML = `<strong>❌ Backend Error (${res.status}):</strong><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (err) {
                status.className = 'status error';
                status.innerHTML = `<strong>❌ Network Error:</strong><pre>${err.message}</pre>`;
            }
        };
    </script>
</body>
</html>
